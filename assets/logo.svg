<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FewNote">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.35" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#b87010"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="url(#rim)" stroke-width="1.2"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <!-- glow halos -->
  <g filter="url(#soft)" opacity="0.9">
    <!-- F on 5x7 grid, origin (16,8), cell 8 -->
    <circle cx="16" cy="8"  r="7" fill="url(#glow)"/>
    <circle cx="24" cy="8"  r="7" fill="url(#glow)"/>
    <circle cx="32" cy="8"  r="7" fill="url(#glow)"/>
    <circle cx="40" cy="8"  r="7" fill="url(#glow)"/>
    <circle cx="48" cy="8"  r="7" fill="url(#glow)"/>
    <circle cx="16" cy="16" r="7" fill="url(#glow)"/>
    <circle cx="16" cy="24" r="7" fill="url(#glow)"/>
    <circle cx="16" cy="32" r="7" fill="url(#glow)"/>
    <circle cx="24" cy="32" r="7" fill="url(#glow)"/>
    <circle cx="32" cy="32" r="7" fill="url(#glow)"/>
    <circle cx="16" cy="40" r="7" fill="url(#glow)"/>
    <circle cx="16" cy="48" r="7" fill="url(#glow)"/>
    <circle cx="16" cy="56" r="7" fill="url(#glow)"/>
  </g>
  <!-- solid cores -->
  <g>
    <circle cx="16" cy="8"  r="3.2" fill="url(#dot)"/>
    <circle cx="24" cy="8"  r="3.2" fill="url(#dot)"/>
    <circle cx="32" cy="8"  r="3.2" fill="url(#dot)"/>
    <circle cx="40" cy="8"  r="3.2" fill="url(#dot)"/>
    <circle cx="48" cy="8"  r="3.2" fill="url(#dot)"/>
    <circle cx="16" cy="16" r="3.0" fill="url(#dot)"/>
    <circle cx="16" cy="24" r="3.0" fill="url(#dot)"/>
    <circle cx="16" cy="32" r="3.2" fill="url(#dot)"/>
    <circle cx="24" cy="32" r="3.2" fill="url(#dot)"/>
    <circle cx="32" cy="32" r="3.2" fill="url(#dot)"/>
    <circle cx="16" cy="40" r="3.0" fill="url(#dot)"/>
    <circle cx="16" cy="48" r="3.0" fill="url(#dot)"/>
    <circle cx="16" cy="56" r="3.0" fill="url(#dot)"/>
  </g>
</svg>
